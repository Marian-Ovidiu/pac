name: PAC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wp-content/themes/my_structure/package-lock.json

      - name: Verify repository policy
        run: php scripts/verify-repository.php

      - name: Validate Composer metadata
        working-directory: wp-content/themes/my_structure
        run: composer validate --no-check-publish

      - name: Validate PAC Core Composer metadata
        working-directory: wp-content/plugins/pac-core
        run: composer validate --strict

      - name: Install PAC Core dependencies
        working-directory: wp-content/plugins/pac-core
        run: composer install --no-interaction --prefer-dist

      - name: Install PHP dependencies
        working-directory: wp-content/themes/my_structure
        run: composer install --no-interaction --prefer-dist

      - name: Audit PHP dependencies
        run: |
          composer audit --working-dir=wp-content/plugins/pac-core --locked
          composer audit --working-dir=wp-content/themes/my_structure --locked

      - name: Install frontend dependencies
        working-directory: wp-content/themes/my_structure
        run: npm ci

      - name: Lint PHP
        run: php scripts/lint-php.php

      - name: Run automatic tests
        working-directory: wp-content/themes/my_structure
        run: npm test

      - name: Build frontend
        working-directory: wp-content/themes/my_structure
        run: npm run build

      - name: Verify committed Vite artifacts
        run: git diff --exit-code -- wp-content/themes/my_structure/public
